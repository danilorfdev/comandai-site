# Comandaí — site institucional (arquivos estáticos gerados pelo Angular)
# Fica atrás do Caddy, que cuida do HTTPS e do redirecionamento www → sem www.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

  # Um endereço só por página: /planos/ → /planos (o Google não vê conteúdo duplicado)
  rewrite ^/(.+)/$ /$1 permanent;

  # Cópia "sem pré-render" que o Angular gera: não serve para visitante nem buscador
  location = /index.csr.html { return 404; }

  # Arquivos do build com hash no nome: cache de 1 ano
  location ~* "-[A-Z0-9]{8,}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/seguranca.conf;
  }
  location ~* \.(woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/seguranca.conf;
  }

  # Imagens, ícones, sitemap e robots: podem mudar, então cache curto
  location ~* \.(svg|png|jpg|webp|ico|webmanifest|xml|txt)$ {
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/seguranca.conf;
  }

  # Páginas: /planos → planos/index.html (HTML pronto, gerado no build)
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/seguranca.conf;
  }

  # Página que não existe: devolve o código 404 de verdade, com a página bonita
  error_page 404 /404/index.html;
  location = /404/index.html {
    internal;
    add_header Cache-Control "no-cache";
    include /etc/nginx/seguranca.conf;
  }
}
